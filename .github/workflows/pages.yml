# Veröffentlicht den Ordner fitplan/ bei jedem Push auf main über GitHub Pages.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Jede Veröffentlichung bekommt eine neue Cache-Version, damit Handys das Update laden.
      - name: Cache-Version automatisch setzen
        run: sed -i "s/^const VERSION = .*/const VERSION = 'fitplan-${GITHUB_SHA::8}';/" fitplan/sw.js && grep "^const VERSION" fitplan/sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: fitplan
      - id: deployment
        uses: actions/deploy-pages@v4
